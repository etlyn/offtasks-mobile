name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: npx --yes yarn@1.22.22 install --frozen-lockfile
      - run: npx --yes yarn@1.22.22 test --runInBand --watchman=false
      - run: node --test scripts/verify-production.test.mjs
      - run: bash -n ios/ci_scripts/ci_post_clone.sh ios/ci_scripts/ci_pre_xcodebuild.sh